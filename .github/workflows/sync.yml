name: Actualizar catálogo

on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Actualizar productos.json desde shopclub
        run: node sync.js

      - name: Publicar cambios (si los hay)
        run: |
          git config user.name  "catalogo-bot"
          git config user.email "actions@users.noreply.github.com"
          git add productos.json
          if git diff --cached --quiet; then
            echo "Sin cambios en el catálogo."
          else
            git commit -m "Actualización automática del catálogo"
            git push
          fi
